name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXY_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
      EXY_KEY_ALIAS: ${{ secrets.EXEGETE_KEY_ALIAS }}
      EXY_KEYSTORE_PASSWORD: ${{ secrets.EXEGETE_KEYSTORE_PASSWORD }}
      EXY_KEY_PASSWORD: ${{ secrets.EXEGETE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test page capture
        run: node --test app/src/test/js/chat-page.test.cjs
      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.EXEGETE_SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | base64 --decode > "$EXY_KEYSTORE_FILE"
      - name: Test and build
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease
      - name: Prepare artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "Exegete-${version}.apk"
          sha256sum "Exegete-${version}.apk" > "Exegete-${version}.apk.sha256"
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Exegete-*.apk Exegete-*.apk.sha256 --prerelease --generate-notes --title "Exegete $GITHUB_REF_NAME"
